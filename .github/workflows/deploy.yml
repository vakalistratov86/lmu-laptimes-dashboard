name: Release, Build & Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: vakalistratov86/lmu-laptimes-dashboard

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.semrelease.outputs.new_release_published }}
      version: ${{ steps.semrelease.outputs.new_release_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Определяет версию по Conventional Commits с последнего тега (см.
      # .releaserc.json), обновляет package.json/CHANGELOG.md, коммитит,
      # ставит git-тег vX.Y.Z и публикует GitHub Release. Коммиты без
      # feat/fix/perf/refactor/revert (например chore/docs) релиз не создают —
      # тогда published=false и последующие джобы пропускаются.
      - name: Release
        id: semrelease
        uses: cycjimmy/semantic-release-action@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-and-push:
    needs: release
    if: needs.release.outputs.published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:latest
            ghcr.io/${{ env.IMAGE_NAME }}:v${{ needs.release.outputs.version }}

  deploy:
    needs: [release, build-and-push]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Copy docker-compose.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/opt/lmu-dashboard"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            mkdir -p /opt/lmu-dashboard
            cd /opt/lmu-dashboard

            printf 'POSTGRES_PASSWORD=%s\nADMIN_TOKEN=%s\n' '${{ secrets.POSTGRES_PASSWORD }}' '${{ secrets.ADMIN_TOKEN }}' > .env
            chmod 600 .env

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            docker compose config

            docker pull ghcr.io/vakalistratov86/lmu-laptimes-dashboard:latest

            # Применяем изменения схемы (shared/schema.ts) к БД новым образом
            # ДО переключения на него — иначе окно между стартом нового
            # контейнера и ручным db:push отдаёт 500 на любой запрос,
            # затрагивающий новые колонки (см. инцидент с has_co_drivers).
            docker compose run --rm dashboard npx drizzle-kit push --force

            docker rm -f lmu-dashboard || true

            docker compose up -d --force-recreate

            docker image prune -f
